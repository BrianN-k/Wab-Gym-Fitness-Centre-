{% extends 'base.html' %}
{% block page_title %}{{ title }}{% endblock %}
{% block content %}
<div class="section-header">
  <h4><i class="bi bi-person-plus me-2" style="color:#1a7a4a"></i>{{ title }}</h4>
  <a href="{% url 'user_list' %}" class="btn btn-outline-secondary btn-sm">← Back</a>
</div>
<div class="card" style="max-width:600px">
  <div class="card-header">{{ title }}</div>
  <div class="card-body">
    <form method="post">
      {% csrf_token %}
      {% for field in form %}
      <div class="mb-3">
        <label class="form-label">{{ field.label }}</label>
        {{ field }}
        {% if field.errors %}
          {% for err in field.errors %}
          <div class="text-danger" style="font-size:12px">{{ err }}</div>
          {% endfor %}
        {% endif %}
      </div>
      {% endfor %}
      <button type="submit" class="btn btn-wab w-100">Save User</button>
    </form>
  </div>
</div>
{% endblock %}

{% extends 'base.html' %}
{% block page_title %}Reset Password{% endblock %}
{% block content %}
<div class="section-header">
  <h4><i class="bi bi-key me-2" style="color:#1a7a4a"></i>Reset Password — {{ obj.username }}</h4>
  <a href="{% url 'user_list' %}" class="btn btn-outline-secondary btn-sm">← Back</a>
</div>
<div class="card" style="max-width:400px">
  <div class="card-header">Set New Password</div>
  <div class="card-body">
    <form method="post">
      {% csrf_token %}
      <div class="mb-3">
        <label class="form-label">New Password</label>
        <input type="password" name="password" class="form-control" required minlength="6">
        <div class="form-text">Minimum 6 characters</div>
      </div>
      <button type="submit" class="btn btn-wab w-100">Reset Password</button>
    </form>
  </div>
</div>
{% endblock %}

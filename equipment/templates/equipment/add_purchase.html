{% extends 'base.html' %}
{% block page_title %}Add Equipment Purchase{% endblock %}

{% block content %}

<div class="section-header">
    <h4>
        <i class="bi bi-cart-plus me-2" style="color:#1a7a4a"></i>
        Add Equipment Purchase
    </h4>

    <a href="{% url 'equipment_list' %}" class="btn btn-outline-secondary">
        <i class="bi bi-arrow-left"></i> Back
    </a>
</div>

<div class="card">
    <div class="card-header">
        Purchase Details
    </div>

    <div class="card-body">

        <div class="alert alert-info">
            <strong>Equipment:</strong> {{ equipment.name }} <br>
            <strong>Brand:</strong> {{ equipment.brand }} <br>
            <strong>Current Quantity:</strong> {{ equipment.quantity }}
        </div>

        <form method="POST">
            {% csrf_token %}

            <div class="row">

                <div class="col-md-4 mb-3">
                    <label class="form-label">
                        Quantity Purchased
                    </label>

                    <input
                        type="number"
                        name="quantity"
                        class="form-control"
                        min="1"
                        required>
                </div>

                <div class="mb-3">
                    <label class="form-label">
                        Unit Price (KSh)
                    </label>

                    <input
                        type="text"
                        class="form-control"
                        value="KSh {{ equipment.price|floatformat:0 }}"
                        readonly>
                </div>

                <div class="col-md-4 mb-3">
                    <label class="form-label">
                        Purchase Date
                    </label>

                    <input
                        type="date"
                        name="purchase_date"
                        class="form-control"
                        required>
                </div>

            </div>

            <hr>

            <button class="btn btn-success">
                <i class="bi bi-plus-circle"></i>
                Save Purchase
            </button>

            <a href="{% url 'equipment_list' %}" class="btn btn-secondary">
                Cancel
            </a>

        </form>

    </div>
</div>

{% endblock %}

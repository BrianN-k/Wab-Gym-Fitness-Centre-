{% extends 'base.html' %}
{% block page_title %}{{ title }}{% endblock %}
{% block content %}
<div class="section-header">
  <h4><i class="bi bi-person-badge me-2" style="color:#1a7a4a"></i>{{ title }}</h4>
  <a href="{% url 'coach_list' %}" class="btn btn-outline-secondary btn-sm">← Back</a>
</div>
<div class="card" style="max-width:700px">
  <div class="card-header">{{ title }}</div>
  <div class="card-body">
    <form method="post">
      {% csrf_token %}
      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label">Full Name *</label>
          <input type="text" name="name" class="form-control" value="{{ coach.name|default:'' }}" required>
        </div>
        <div class="col-md-6">
          <label class="form-label">Phone *</label>
          <input type="text" name="phone" class="form-control" value="{{ coach.phone|default:'' }}" required>
        </div>
        <div class="col-md-6">
          <label class="form-label">Email</label>
          <input type="email" name="email" class="form-control" value="{{ coach.email|default:'' }}">
        </div>
        <div class="col-md-6">
          <label class="form-label">Specialization</label>
          <input type="text" name="specialization" class="form-control" value="{{ coach.specialization|default:'' }}" placeholder="e.g. Bodybuilding, Weight Loss">
        </div>
        <div class="col-md-6">
          <label class="form-label">Monthly Salary (KSh)</label>
          <input type="number" name="salary" class="form-control" value="{{ coach.salary|default:'0' }}" min="0">
        </div>
        <div class="col-12">
          <label class="form-label">Qualifications</label>
          <textarea name="qualifications" class="form-control" rows="3">{{ coach.qualifications|default:'' }}</textarea>
        </div>
      </div>
      <div class="mt-4">
        <button type="submit" class="btn btn-wab px-5">
          <i class="bi bi-check me-2"></i>{% if coach %}Update Coach{% else %}Register Coach{% endif %}
        </button>
        <a href="{% url 'coach_list' %}" class="btn btn-outline-secondary ms-2">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}

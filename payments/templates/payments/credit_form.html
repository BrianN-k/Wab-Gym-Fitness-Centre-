{% extends 'base.html' %}
{% block page_title %}Record Expense{% endblock %}
{% block content %}
<div class="section-header">
  <h4><i class="bi bi-arrow-up-circle me-2" style="color:#dc3545"></i>Record Expense Transaction</h4>
  <a href="{% url 'payment_list' %}" class="btn btn-outline-secondary btn-sm">← Back</a>
</div>
<div class="card" style="max-width:600px">
  <div class="card-header" style="background:#721c24">New Expense Entry</div>
  <div class="card-body">
    <form method="post" id="creditForm">
      {% csrf_token %}
      <div class="mb-3">
        <label class="form-label">Reason *</label>
        <select name="reason" class="form-select" id="reasonSelect" required>
          <option value="salary_employee">Employee Salary</option>
          <option value="salary_coach">Coach Salary</option>
          <option value="buy_equipment">Buy Equipment</option>
        </select>
      </div>
      <div class="mb-3" id="empField">
        <label class="form-label">Select Employee</label>
        <select name="employee" class="form-select">
          <option value="">-- Select --</option>
          {% for e in employees %}
          <option value="{{ e.pk }}">{{ e.get_full_name|default:e.username }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="mb-3 d-none" id="coachField">
        <label class="form-label">Select Coach</label>
        <select name="coach" class="form-select">
          <option value="">-- Select --</option>
          {% for c in coaches %}
          <option value="{{ c.pk }}">{{ c.name }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="mb-3 d-none" id="eqField">
        <label class="form-label">Select Equipment</label>
        <select name="equipment" class="form-select">
          <option value="">-- Select --</option>
          {% for eq in equipments %}
          <option value="{{ eq.pk }}">{{ eq.name }} ({{ eq.serial }})</option>
          {% endfor %}
        </select>
      </div>
      <div class="mb-3">
        <label class="form-label">Amount (KSh) *</label>
        <input type="number" name="amount" class="form-control" min="1" step="0.01" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Date & Time *</label>
        <input type="datetime-local" name="date" class="form-control" required value="{% now 'Y-m-d\TH:i' %}">
      </div>
      <button type="submit" class="btn btn-danger w-100">
        <i class="bi bi-check me-2"></i>Save Expense Transaction
      </button>
    </form>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script>
document.getElementById('reasonSelect').addEventListener('change', function() {
  document.getElementById('empField').classList.add('d-none');
  document.getElementById('coachField').classList.add('d-none');
  document.getElementById('eqField').classList.add('d-none');
  if (this.value === 'salary_employee') document.getElementById('empField').classList.remove('d-none');
  else if (this.value === 'salary_coach') document.getElementById('coachField').classList.remove('d-none');
  else if (this.value === 'buy_equipment') document.getElementById('eqField').classList.remove('d-none');
});
</script>
{% endblock %}

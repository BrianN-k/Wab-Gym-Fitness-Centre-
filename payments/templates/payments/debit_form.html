{% extends 'base.html' %}
{% block page_title %}Record Income{% endblock %}
{% block content %}
<div class="section-header">
  <h4><i class="bi bi-arrow-down-circle me-2" style="color:#1a7a4a"></i>Record Income Transaction</h4>
  <a href="{% url 'payment_list' %}" class="btn btn-outline-secondary btn-sm">← Back</a>
</div>
<div class="card" style="max-width:600px">
  <div class="card-header">New Income Entry</div>
  <div class="card-body">
    <form method="post">
      {% csrf_token %}
      <div class="mb-3">
        <label class="form-label">Select Member *</label>
        <select name="member" class="form-select" required>
          <option value="">-- Select Member --</option>
          {% for m in members %}
          <option value="{{ m.pk }}">{{ m.member_id }} — {{ m.name }} ({{ m.phone }})</option>
          {% endfor %}
        </select>
      </div>
      <div class="mb-3">
        <label class="form-label">Reason *</label>
        <select name="reason" class="form-select" required>
          <option value="admission">Admission</option>
          <option value="package_fee" selected>Package Fee</option>
          <option value="private_session">Private Session</option>
        </select>
      </div>
      <div class="mb-3">
        <label class="form-label">Amount (KSh) *</label>
        <input type="number" name="amount" class="form-control" min="1" step="0.01" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Date & Time *</label>
        <input type="datetime-local" name="date" class="form-control" required
               value="{% now 'Y-m-d\TH:i' %}">
      </div>
      <button type="submit" class="btn btn-wab w-100">
        <i class="bi bi-check me-2"></i>Save Income Transaction
      </button>
    </form>
  </div>
</div>
{% endblock %}
